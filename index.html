<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8f8" />
  <title>Untitled</title>
  <link rel="stylesheet" href="styles.css?v=2.5" />
  <style>
    .home-card{min-height:560px}
    .day-grid{display:grid;gap:14px;margin-top:34px}
    .day-link,.day-locked{display:flex;align-items:center;justify-content:space-between;width:100%;padding:18px 20px;border-radius:18px;text-decoration:none;font-weight:800;border:1px solid var(--border)}
    .day-link{background:var(--rose-soft);color:var(--text)}
    .day-locked{background:#fff;color:var(--muted);opacity:.78}
    .day-meta{font-size:.82rem;font-weight:700;opacity:.75}
    .home-note{margin-top:26px;color:var(--muted);font-size:.95rem;line-height:1.5}
    .version-tag{position:fixed;right:10px;bottom:8px;font-size:11px;color:var(--muted);opacity:.55;z-index:20}
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="card home-card">
      <div class="tiny-hearts" aria-hidden="true"><span>·</span><span>·</span><span>·</span></div>
      <div class="screen">
        <div class="content fade-in">
          <p class="eyebrow">Ein kleines fortlaufendes Projekt</p>
          <h1>Untitled</h1>
          <p class="lead">Manche Dinge brauchen noch keinen Titel.</p>
          <div class="day-grid">
            <a class="day-link" href="day1.html"><span>Tag 1</span><span class="day-meta">✓</span></a>
            <a class="day-link" href="day2.html"><span>Tag 2</span><span class="day-meta">NEU</span></a>
            <div class="day-locked"><span>Tag 3</span><span class="day-meta">🔒</span></div>
            <div class="day-locked"><span>Tag 4</span><span class="day-meta">🔒</span></div>
          </div>
          <p class="home-note">Nicht alles ist schon bereit. Das ist Absicht.</p>
        </div>
      </div>
    </section>
  </main>
  <div class="version-tag">v2.5</div>
</body>
</html>
